# Disable USB logging - it conflicts with HID keyboard
# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_KEYBOARD_NAME="SWEEP-v3"
CONFIG_ZMK_USB=y

# Enable BLE for split communication and host connections
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3



